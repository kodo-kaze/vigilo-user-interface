services:
  vigilo-user-interface:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigilo-user-interface:latest
    container_name: vigilo-user-interface
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://vigilo-edge-api:8000
